version: '3.8'

services:
  # Development server with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: saa-website-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    restart: unless-stopped

  # Production build for testing
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saa-website-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles:
      - production
